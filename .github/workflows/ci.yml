# CI for vita-vn-ocr. Every action is pinned to a full commit SHA, with its tag in the comment.
# ci/README.md lists the local command for each job and when each job runs.
#
# Minutes: this is a private repo, so every job minute is billed. The ruff job also runs the repo
# policy test and ci/changed.py, which gates the other jobs on the paths the change touched:
# documentation-only changes run nothing else, and the training smoke, the C runtime and the
# VitaSDK build run only when something they read changed (full compiler matrix on main).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  ruff:
    name: ruff + policy
    # Draft pull requests get no CI; marking one ready (ready_for_review) runs it.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pytest: ${{ steps.changed.outputs.pytest }}
      smoke: ${{ steps.changed.outputs.smoke }}
      runtime: ${{ steps.changed.outputs.runtime }}
      cc: ${{ steps.changed.outputs.cc }}
      vita: ${{ steps.changed.outputs.vita }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which jobs does this change need? (ci/changed.py gates the jobs below)
        id: changed
        env:
          # The base branch tip for a pull request, the previous tip for a push to main;
          # empty for workflow_dispatch, which runs everything.
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/changed.py --base "$CI_BASE_SHA"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install ruff and pytest (versions and hashes from requirements-ci.lock)
        run: |
          sed -n -E '/^(ruff|pytest|pluggy|iniconfig|packaging|pygments)==/,/^    # via/p' requirements-ci.lock > "$RUNNER_TEMP/lint.txt"
          uv venv "$RUNNER_TEMP/lint"
          uv pip install --python "$RUNNER_TEMP/lint/bin/python" --require-hashes --no-deps -r "$RUNNER_TEMP/lint.txt"
      - name: ruff check
        run: '"$RUNNER_TEMP/lint/bin/ruff" check --output-format=github .'
      - name: Repo policy on every tracked file (tests/test_repo_policy.py; runs even when pytest is skipped)
        run: '"$RUNNER_TEMP/lint/bin/python" -m pytest -q -p no:cacheprovider tests/test_repo_policy.py tests/test_ci_changed.py'

  pytest:
    name: pytest
    needs: ruff
    if: ${{ needs.ruff.outputs.pytest == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Fetch the pinned OFL font (google/fonts, sha256-checked)
        run: python ci/fonts.py
      - name: pytest
        run: python -m pytest

  train-smoke:
    name: training smoke (50 steps)
    needs: ruff
    if: ${{ needs.ruff.outputs.smoke == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Render a tiny synthetic set from the pinned OFL font, train 50 CPU steps, check the outputs
        run: python ci/train_smoke.py --workdir "$RUNNER_TEMP/smoke" --threads "$(nproc)"

  runtime:
    # The contract with runtime/ is in ci/runtime.sh. GitHub appends the matrix value to the
    # name: "runtime (gcc)", "runtime (clang)". Pull requests that leave runtime/ alone build with
    # gcc only; C changes, pushes to main and manual runs use both compilers (ci/changed.py).
    name: runtime
    needs: ruff
    if: ${{ needs.ruff.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: ${{ fromJSON(needs.ruff.outputs.cc) }}
    env:
      CC_UNDER_TEST: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sanitizer setup (ASLR entropy ASan can handle, clang's sanitizer runtime)
        run: |
          # ubuntu-24.04 kernels use 32 bits of mmap randomisation, which makes ASan crash or hang.
          sudo sysctl -w vm.mmap_rnd_bits=28
          # runtime/Makefile may build with both compilers, so clang must link sanitized code too.
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/san.c"
          if ! clang -fsanitize=address,undefined "$RUNNER_TEMP/san.c" -o "$RUNNER_TEMP/san"; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          fi
          gcc --version | head -n 1
          clang --version | head -n 1
      - uses: ./.github/actions/python-env
      - name: Build runtime/ (C99, -Werror, ASan + UBSan) and run its parity test
        run: ci/runtime.sh "$CC_UNDER_TEST"

  vita:
    # runtime/ and the vocr_test app built with the pinned VitaSDK (vita/README.md). The VPK is
    # uploaded so it can be installed on a PS Vita without installing the SDK.
    name: vita (VitaSDK build)
    needs: ruff
    if: ${{ needs.ruff.outputs.vita == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned VitaSDK in user space (sha256-checked)
        run: vita/scripts/fetch_vitasdk.sh "$RUNNER_TEMP/vita"
      - name: Build runtime/ (arm-vita-eabi, -Werror) and vocr_test.vpk
        run: VITASDK="$RUNNER_TEMP/vita/vitasdk" vita/scripts/build.sh "$RUNNER_TEMP/build-vita"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vocr_test-vpk
          path: |
            ${{ runner.temp }}/build-vita/vocr_test.vpk
            ${{ runner.temp }}/build-vita/size.txt
          if-no-files-found: error
          # Artifacts of a private repo count against the account's shared storage quota, by the
          # hour. A pull request's VPK is only needed while it is reviewed; the VPK a console
          # test takes (vita/README.md) comes from a push to main or a manual run.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
